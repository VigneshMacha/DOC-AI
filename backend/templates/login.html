<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Chanti AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            },
            surface: {
              800: '#111726',
              850: '#0e1320',
              900: '#0a0d16',
              950: '#06080d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-950 text-slate-100 flex items-center justify-center min-h-screen p-4 antialiased selection:bg-brand-500 selection:text-white">
  <div class="w-full max-w-sm bg-surface-900 border border-white/10 p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    <!-- Ambient Glow Accent -->
    <div class="absolute -top-20 -right-20 w-44 h-44 bg-brand-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/25 mb-3.5">
        <i data-lucide="layers" class="w-5 h-5 text-white"></i>
      </div>
      <h1 class="text-lg font-bold text-white tracking-tight">Welcome Back</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in to your document workspace</p>
    </div>

    <!-- Alert / Flash Messages -->
    {% if error %}
    <div class="mb-5 p-3.5 bg-red-950/40 border border-red-500/30 text-red-200 text-xs rounded-xl flex items-start gap-2.5">
      <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0 mt-0.5"></i>
      <span class="leading-relaxed">{{ error }}</span>
    </div>
    {% endif %}

    <!-- Form -->
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input
            type="email"
            name="email"
            value="{{ email or '' }}"
            required
            placeholder="you@company.com"
            class="w-full pl-10 pr-3.5 py-2.5 bg-surface-950/80 border border-white/10 rounded-xl text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-brand-500/60 focus:ring-1 focus:ring-brand-500/30 transition"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input
            id="password-input"
            type="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full pl-10 pr-10 py-2.5 bg-surface-950/80 border border-white/10 rounded-xl text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-brand-500/60 focus:ring-1 focus:ring-brand-500/30 transition"
          />
          <button
            type="button"
            onclick="togglePasswordVisibility('password-input', this)"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition"
          >
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs rounded-xl transition shadow-lg shadow-brand-600/25 flex items-center justify-center gap-1.5 mt-2"
      >
        <span>Sign In</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 pt-4 border-t border-white/5 text-center">
      <p class="text-xs text-slate-400">
        Don't have an account?
        <a href="/signup" class="text-brand-400 hover:text-brand-300 font-semibold ml-1">Create Account</a>
      </p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }
  </script>
</body>
</html>
